[project]
name = "segstream"
version = "0.1.0"
description = "Segstream take home exam"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.4",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # import sorting
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "C90",    # complexity
    "T20",    # print statements
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/migrations/*.py" = ["E501"]
