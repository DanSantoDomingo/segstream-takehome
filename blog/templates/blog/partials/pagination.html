{% if page_obj.has_other_pages %}
  <nav class="pagination" aria-label="Pagination">
    {% if page_obj.has_previous %}
      <a
        href="?{% if query %}q={{ query|urlencode }}&amp;{% endif %}page={{ page_obj.previous_page_number }}"
        hx-get="?{% if query %}q={{ query|urlencode }}&amp;{% endif %}page={{ page_obj.previous_page_number }}"
        hx-target="{{ target }}"
        hx-push-url="true"
      >Previous</a>
    {% else %}
      <span aria-disabled="true">Previous</span>
    {% endif %}
    <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
      <a
        href="?{% if query %}q={{ query|urlencode }}&amp;{% endif %}page={{ page_obj.next_page_number }}"
        hx-get="?{% if query %}q={{ query|urlencode }}&amp;{% endif %}page={{ page_obj.next_page_number }}"
        hx-target="{{ target }}"
        hx-push-url="true"
      >Next</a>
    {% else %}
      <span aria-disabled="true">Next</span>
    {% endif %}
  </nav>
{% endif %}
